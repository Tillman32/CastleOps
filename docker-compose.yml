version: '3.8'

services:
  castleops-api:
    build:
      context: .
      dockerfile: CastleOps.Api/Dockerfile
    container_name: castleops-api
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://+:5000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - castleops-network

  castleops-web:
    build:
      context: .
      dockerfile: CastleOps.Web/Dockerfile
    container_name: castleops-web
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - castleops-api
    networks:
      - castleops-network

networks:
  castleops-network:
    driver: bridge

volumes:
  castleops-data:
  castleops-logs:
